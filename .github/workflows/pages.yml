name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compilar
        env:
          # Los instaladores se bajan de la release (los de Linux pasan de 100 MB).
          VITE_DESCARGAS: https://github.com/${{ github.repository }}/releases/download/v0.2.0/
          PRENSA_SITIO: https://alonsovine.github.io/prensa-web/
        run: |
          npm run build
          rm -rf dist/descargas
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: despliegue
        uses: actions/deploy-pages@v4
